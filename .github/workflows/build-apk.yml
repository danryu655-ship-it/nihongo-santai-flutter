# Build APK Nihongo Santai di GitHub Actions (pengganti build lokal).
# Cara pakai:
#   1. Naikkan version di pubspec.yaml (mis. 1.0.0+25)
#   2. Commit + push
#   3. git tag v1.0.0+25 && git push origin v1.0.0+25
#   4. APK otomatis muncul di GitHub Releases repo ini (5-10 menit)
# Bisa juga dijalankan manual: tab Actions > Build APK > Run workflow.
# Signing: memakai debug key (sesuai android/app/build.gradle.kts),
# jadi tanpa secret/keystore — sama seperti APK v1.0.0+24 yang sudah di APKPure.
name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
